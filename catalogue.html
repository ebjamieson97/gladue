<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook Catalogue</title>
<meta name="description" content="Every case in the Systemic Factors Casebook, by province and court.">
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #e3e1da; --accent: #1f4e79; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161616; --panel: #222222; --ink: #ececec; --muted: #a3a3a3; --line: #333333; --accent: #6aa6dc; }
  }
  :root[data-theme="dark"] { --bg: #161616; --panel: #222222; --ink: #ececec; --muted: #a3a3a3; --line: #333333; --accent: #6aa6dc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 0;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font: 600 18px/1.2 Georgia, "Times New Roman", serif; margin: 0; flex: 1; }
  header h1 a { color: inherit; text-decoration: none; }
  header h1 small { display: block; font: 400 13px/1.4 system-ui, sans-serif; color: var(--muted); }
  header .bar { max-width: 1000px; margin: 0 auto; width: 100%; padding: 0 24px; display: grid;
                grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  header .bar > a.back { justify-self: start; }
  a.back, button.filter { display: inline-block; text-decoration: none; font-size: 14px; line-height: 1.5; color: var(--ink);
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px;
           box-shadow: 0 2px 0 var(--line); transition: transform .06s ease, box-shadow .06s ease; }
  a.back:hover, button.filter:hover { filter: brightness(.97); }
  a.back:active, button.filter:active { transform: translateY(2px); box-shadow: none; }
  button.filter { font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center;
                  gap: 8px; padding: 8px 22px; border-radius: 10px; }
  button.filter svg { width: 16px; height: 16px; }
  button.filter .n { color: var(--muted); }
  /* Filter box */
  .filterwrap { position: relative; }
  .filterbox { position: absolute; left: 50%; transform: translateX(-50%); top: calc(100% + 8px); z-index: 10; min-width: 250px; background: var(--panel);
               border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 12px 14px; }
  .filterbox[hidden] { display: none; }
  .filterbox .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .filterbox .head b { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .filterbox .head span { font-size: 13px; }
  .filterbox .head a { color: var(--accent); cursor: pointer; text-decoration: none; margin-left: 10px; }
  .filterbox .head a:hover { text-decoration: underline; }
  .filterbox label { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 15px; cursor: pointer; }
  .filterbox label input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .filterbox label .c { margin-left: auto; color: var(--muted); font-size: 13px; }
  .shown { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  [hidden] { display: none !important; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px 24px 60px; }
  details { border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 0; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; display: inline-block; width: 16px; font-size: 22px; line-height: 1; color: var(--muted);
                    transition: transform .15s ease; }
  details[open] > summary::before { transform: rotate(90deg); }
  .prov > summary { font: 600 24px/1.25 Georgia, "Times New Roman", serif; }
  .court { margin-left: 26px; border-bottom: none; }
  .court > summary { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 0; }
  .court ul { margin: 0 0 12px 26px; }
  .count { font: 400 13px system-ui, sans-serif; color: var(--muted); letter-spacing: 0; text-transform: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  li a { color: var(--accent); font-weight: 600; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) { header, main { padding-left: 16px; padding-right: 16px; } h2 { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <div class="bar"><a class="back" id="back" href="index.html">← Back</a>
    <div class="filterwrap">
      <button type="button" class="filter" id="filterbtn" aria-expanded="false" aria-controls="filterbox"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5h13l-5 6v5l-3-1.5v-3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Filter <span class="n" id="filtern"></span></button>
      <div class="filterbox" id="filterbox" hidden role="group" aria-label="Show cases with these mitigating factors">
        <div class="head"><b>Show</b><span><a id="all">All</a><a id="none">None</a></span></div>
        <div id="factorlist"></div>
      </div>
    </div>
  </div>
</header>
<main><p class="shown" id="shown" hidden></p><div id="list"><p class="meta">Loading…</p></div></main>
<script src="cases.js"></script>
<script>
(function () {
  const cases = window.CASES || [];
  // Back: the last case viewed on the main page, or a random case if that is not known.
  try {
    const last = localStorage.getItem("casebook:last");
    if (last && cases.some(c => c.id === last)) document.getElementById("back").href = "index.html#" + last;
  } catch (e) {}
  const list = document.getElementById("list");
  if (!cases.length) { list.innerHTML = '<p class="meta">Could not load the case list (cases.js).</p>'; return; }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const PROVINCE_ORDER = ["British Columbia", "Ontario", "Nova Scotia", "Newfoundland and Labrador", "Canada (Supreme Court)"];
  // Trial courts first within a province, then appeal courts.
  const COURT_ORDER = ["BCSC", "BCCA", "ONCA", "NSPC", "NSSC", "NSCA", "NLCA", "SCC"];
  const byProv = new Map();
  for (const c of cases) {
    if (!byProv.has(c.province)) byProv.set(c.province, new Map());
    const courts = byProv.get(c.province);
    if (!courts.has(c.court_code)) courts.set(c.court_code, []);
    courts.get(c.court_code).push(c);
  }
  const provs = [...byProv.keys()].sort((a, b) => PROVINCE_ORDER.indexOf(a) - PROVINCE_ORDER.indexOf(b));
  list.innerHTML = provs.map(p => {
    const courts = [...byProv.get(p).keys()].sort((a, b) => COURT_ORDER.indexOf(a) - COURT_ORDER.indexOf(b));
    return `<details class="prov" open><summary>${esc(p)}</summary>` + courts.map(code => {
      const items = byProv.get(p).get(code).slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      return `<details class="court"><summary>${esc(items[0].court)}</summary><ul>` + items.map(c =>
        `<li data-factors="${esc(JSON.stringify(c.factors || []))}"><a href="index.html#${esc(c.id)}">${esc(c.name)}, ${esc(c.citation)}</a>
           <div class="meta">${esc(c.offence)}${c.factors.length ? " · " + esc(c.factors.join(", ")) : ""}</div></li>`).join("") + "</ul></details>";
    }).join("") + "</details>";
  }).join("");

  // Filter: one checkbox per mitigating-factor tag found in the cases (so new tags appear by themselves), all on by default.
  // A case is shown when at least one of its tags is checked; empty courts and provinces are hidden.
  const ORDER = ["Gladue factors", "Residential schools", "Colonialism", "Intergenerational trauma", "Anti-Black racism",
                 "Systemic racism", "Islamophobia", "White supremacy", "Other prejudice"];
  const counts = new Map();
  for (const c of cases) for (const f of (c.factors || [])) counts.set(f, (counts.get(f) || 0) + 1);
  const factors = [...counts.keys()].sort((a, b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const box = document.getElementById("filterbox"), btn = document.getElementById("filterbtn");
  document.getElementById("factorlist").innerHTML = factors.map(f =>
    `<label><input type="checkbox" value="${esc(f)}" checked> ${esc(f)} <span class="c">${counts.get(f)}</span></label>`).join("");
  const boxes = [...box.querySelectorAll("input")];
  function apply() {
    const on = new Set(boxes.filter(b => b.checked).map(b => b.value));
    let n = 0;
    list.querySelectorAll("li").forEach(li => {
      const show = JSON.parse(li.dataset.factors).some(f => on.has(f));
      li.hidden = !show; if (show) n++;
    });
    list.querySelectorAll(".court").forEach(d => { d.hidden = !d.querySelector("li:not([hidden])"); });
    list.querySelectorAll(".prov").forEach(d => { d.hidden = !d.querySelector(".court:not([hidden])"); });
    const all = on.size === boxes.length;
    document.getElementById("filtern").textContent = all ? "" : `(${on.size} of ${boxes.length})`;
    const shown = document.getElementById("shown");
    shown.hidden = all;
    shown.textContent = n ? `Showing ${n} of ${cases.length} cases` : "No cases match: check at least one factor.";
  }
  boxes.forEach(b => b.addEventListener("change", apply));
  document.getElementById("all").addEventListener("click", () => { boxes.forEach(b => b.checked = true); apply(); });
  document.getElementById("none").addEventListener("click", () => { boxes.forEach(b => b.checked = false); apply(); });
  const toggle = open => { box.hidden = !open; btn.setAttribute("aria-expanded", String(open)); };
  btn.addEventListener("click", e => { e.stopPropagation(); toggle(box.hidden); });
  document.addEventListener("click", e => { if (!box.hidden && !box.contains(e.target)) toggle(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") toggle(false); });
})();
</script>
</body>
</html>
