<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casebook Statistics</title>
<meta name="description" content="How many criminal decisions were surveyed, how many were sentencing decisions, and how many mention systemic factors, by province and court.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #d9d6cc; --accent: #1f4e79; --gladue: #9b1c1c; --bar: #e6e2d6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161616; --panel: #222222; --ink: #ececec; --muted: #a3a3a3; --line: #3a3a3a; --accent: #6aa6dc; --gladue: #ff8a80; --bar: #333333; }
  }
  :root[data-theme="dark"] { --bg: #161616; --panel: #222222; --ink: #ececec; --muted: #a3a3a3; --line: #3a3a3a; --accent: #6aa6dc; --gladue: #ff8a80; --bar: #333333; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 0; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  a.back { display: inline-block; text-decoration: none; font-size: 14px; line-height: 1.5; color: var(--ink);
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; box-shadow: 0 2px 0 var(--line); }
  a.back:active { transform: translateY(2px); box-shadow: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
  h1 { font: 600 34px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; }

  .node { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; text-align: center; }
  .big { font: 700 40px/1.1 Georgia, "Times New Roman", serif; }
  .mid { font: 700 26px/1.1 Georgia, "Times New Roman", serif; }
  .what { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .root, .total, .gladue { max-width: 520px; margin: 0 auto; }
  .stem { width: 2px; height: 26px; background: var(--line); margin: 0 auto; }

  /* Provinces branch out from the root; their courts hang below them. */
  .provinces { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; position: relative; padding-top: 26px; }
  .provinces::before { content: ""; position: absolute; top: 0; height: 2px; background: var(--line);
                       left: calc(100% / var(--n) / 2); right: calc(100% / var(--n) / 2); }
  .prov { position: relative; display: flex; flex-direction: column; }
  .prov::before { content: ""; position: absolute; top: -26px; left: 50%; width: 2px; height: 26px; background: var(--line); }
  .prov > .node { border-top: 4px solid var(--accent); }
  .prov .name { font-weight: 700; font-size: 17px; line-height: 1.25; }
  .courts { margin-top: 12px; padding-left: 14px; border-left: 2px solid var(--line); margin-left: 12px; display: grid; gap: 10px; }
  .court { position: relative; text-align: left; padding: 10px 12px; }
  .court::before { content: ""; position: absolute; left: -16px; top: 22px; width: 14px; height: 2px; background: var(--line); }
  .court .cname { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-top: 6px; color: var(--muted); }
  .row b { color: var(--ink); font-weight: 700; }
  .meter { height: 6px; background: var(--bar); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .meter.g span { background: var(--gladue); }
  .gladue { border-top: 4px solid var(--gladue); }
  .gladue .mid { color: var(--gladue); }
  /* The total splits into two cards: trial-court sentencings and appeals. */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; position: relative; padding-top: 22px; }
  .split::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 2px; background: var(--line); }
  .split > .node { position: relative; }
  .split > .node::before { content: ""; position: absolute; top: -22px; left: 50%; width: 2px; height: 22px; background: var(--line); }
  @media (max-width: 700px) { .split { grid-template-columns: 1fr; padding-top: 0; } .split::before, .split > .node::before { display: none; } }
  h2 { font: 600 26px/1.25 Georgia, "Times New Roman", serif; margin: 34px 0 16px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
  h3 { font: 600 19px/1.3 Georgia, "Times New Roman", serif; margin: 30px 0 8px; }
  #models { margin-top: 50px; scroll-margin-top: 12px; }
  .body { max-width: 860px; }
  ul.body li { margin-bottom: 6px; }
  .eq { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin: 10px 0 14px;
        overflow-x: auto; font-size: 17px; }
  .tablewrap { overflow-x: auto; margin: 12px 0 8px; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  .tnote { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 900px; }
  td.key { font-weight: 700; color: var(--gladue); }
  tr:last-child td { border-bottom: none; }
  dl.vars { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; max-width: 900px; }
  dl.vars dt { font-size: 15px; } dl.vars dd { margin: 0; }
  @media (max-width: 700px) { dl.vars { grid-template-columns: 1fr; } dl.vars dd { margin: -4px 0 8px; } }
  /* Trend charts */
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; position: relative; }
  .chart h4 { margin: 0; font-size: 15px; font-weight: 700; }
  .chart .csub { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .grid line { stroke: var(--line); stroke-width: 1; }
  .chart .axis text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .chart .hit { fill: transparent; cursor: default; }
  .tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; line-height: 1.4;
         padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; }
  details.numbers { margin-top: 10px; font-size: 13px; color: var(--muted); }
  details.numbers summary { cursor: pointer; }
  details.numbers table { margin-top: 8px; font-size: 13px; }
  @media (max-width: 820px) { .charts { grid-template-columns: 1fr; } }
  .note { max-width: 640px; margin: 18px auto 0; color: var(--muted); font-size: 13px; text-align: center; }
  .legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  @media (max-width: 900px) {
    main { padding: 20px 16px 50px; } .bar { padding: 0 16px; } h1 { font-size: 27px; }
    .provinces { grid-template-columns: 1fr; padding-top: 0; gap: 22px; }
    .provinces::before, .prov::before { display: none; }
  }
</style>
</head>
<body>
<header><div class="bar"><a class="back" id="back" href="index.html">← Back</a></div></header>
<main>
  <h1>Statistics</h1>
  <h2 id="over-time">Gladue Sentencing Over Time</h2>
  <div id="trend"></div>
  <h2 id="data">Data</h2>
  <p class="sub" id="sub"></p>
  <div id="tree"><p class="sub">Loading…</p></div>

  <!-- MODEL RESULTS: hidden for now. To show them again, delete this comment line and the closing
       "END MODEL RESULTS" line below; the numbers come from site/models.js, written by build_site.py.
  <section id="models">
    <h2>Model results</h2>
    <p class="body">Many factors affect the length of a prison term: the type of offence, whether it is a first offence,
      the number of offences, whether the offender pleaded guilty, the court that passed the sentence, the legal era in which
      it was given, and so on.</p>
    <p class="body">To measure the effect of treating systemic factors as mitigating, a multivariate regression controls for
      these factors. <span id="m-summary"></span></p>

    <h3>Length of the prison term</h3>
    <p class="body">Ordinary least squares on the log of the prison term, for every sentencing decision with a fixed jail term:</p>
    <div class="eq" data-tex="\ln(\text{Months}_i) = \alpha + \beta\,\text{Systemic}_i + \sum_{k=1}^{11}\gamma_k\,\text{Offence}_{ik} + \delta\,\text{Multiple}_i + \theta\,\text{FirstOffence}_i + \lambda\,\text{Plea}_i + \kappa\,\text{Youth}_i + \mu_{c(i)} + \tau_{e(i)} + \eta_{s(i)} + \varepsilon_i"></div>
    <div class="tablewrap"><table id="t-length"></table></div>
    <p class="tnote">Standard errors are clustered by court and estimated with the leave-one-court-out jackknife (CRV3).
      p-values and 95% ranges use a <em>t</em> distribution with <em>G</em> − 1 degrees of freedom, where <em>G</em> is the number of courts.</p>

    <h3>Variables</h3>
    <dl class="vars">
      <dt><span data-tex="\text{Months}_i"></span></dt><dd>Total prison term in months, before credit for time already served.</dd>
      <dt><span data-tex="\text{Systemic}_i"></span></dt><dd>1 if the court treated a systemic factor as mitigating: Gladue factors, residential schools, colonialism, intergenerational trauma, or anti-Black or other racism. In the "Gladue factors specifically" models, 1 if Gladue factors were treated as mitigating.</dd>
      <dt><span data-tex="\text{Offence}_{ik}"></span></dt><dd>11 indicators for the offence categories (homicide, sexual, assault, robbery, kidnapping, break and enter, theft and fraud, drugs, weapons, driving, other). A decision can have several.</dd>
      <dt><span data-tex="\text{Multiple}_i"></span></dt><dd>1 if the decision involves more than one offence category.</dd>
      <dt><span data-tex="\text{FirstOffence}_i"></span></dt><dd>1 if the court accepted a lack of criminal record (no, minor or dated record) as mitigating.</dd>
      <dt><span data-tex="\text{Plea}_i"></span></dt><dd>1 if the court accepted a guilty plea as mitigating.</dd>
      <dt><span data-tex="\text{Youth}_i"></span></dt><dd>1 if the court accepted the offender's youth as mitigating.</dd>
      <dt><span data-tex="\mu_{c(i)}"></span></dt><dd>Court fixed effects (8 courts). Reference category: BC Court of Appeal.</dd>
      <dt><span data-tex="\tau_{e(i)}"></span></dt><dd>Legal-era fixed effects: before s. 718.2(e) (to Sept. 1996); s. 718.2(e) to <em>Gladue</em> (to Apr. 1999); <em>Gladue</em> to <em>Ipeelee</em> (to Mar. 2012); <em>Ipeelee</em> to Bill C-5 (to Nov. 2022); after Bill C-5. Reference category: before s. 718.2(e) in the models for all decisions and Gladue factors; <em>Gladue</em> to <em>Ipeelee</em> in the model among Indigenous offenders, which has no earlier decisions.</dd>
      <dt><span data-tex="\eta_{s(i)}"></span></dt><dd>Stage of the case (trial sentencing; appeal upheld, reduced, increased or varied). Reference category: sentence increased on appeal.</dd>
    </dl>

    <h3>Sample and estimation</h3>
    <ul class="body">
      <li>Adult sentencing decisions only: youth sentences, which have much lower maximums, are left out, as are decisions that do not fix a sentence (for example a new trial ordered).</li>
      <li>Only decisions with a fixed jail term are used; life and indeterminate sentences have no length in months, and no-jail sentences have none at all.</li>
      <li>Standard errors are clustered by court and estimated with the leave-one-court-out jackknife (CRV3); p-values and 95% ranges use a <em>t</em> distribution with <em>G</em> − 1 degrees of freedom, where <em>G</em> is the number of courts (8). The "Among Indigenous offenders only" models use the decisions that identify the offender as Indigenous.</li>
<li>The first-offence, plea and youth controls are recorded only when the court accepted them as mitigating.</li>
    </ul>
  </section>
  END MODEL RESULTS -->
</main>
<script src="stats.js"></script>
<script src="models.js"></script>
<script>
(function () {
  const S = window.STATS;
  const el = document.getElementById("tree");
  if (!S) { el.innerHTML = '<p class="sub">Could not load the statistics (stats.js). Rebuild the site.</p>'; return; }
  const fmt = n => n.toLocaleString("en-CA");
  const pct = (a, b) => b ? (100 * a / b).toFixed(1).replace(/\.0$/, "") + "%" : "–";
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const ORDER = ["British Columbia", "Ontario", "Nova Scotia", "Newfoundland and Labrador", "Canada (Supreme Court)"];
  const COURT_ORDER = ["BCSC", "BCCA", "ONCA", "NSPC", "NSSC", "NSCA", "NLCA", "SCC"];
  const provs = S.provinces.slice().sort((a, b) => ORDER.indexOf(a.name) - ORDER.indexOf(b.name));
  document.getElementById("sub").textContent =
    "From every criminal decision in the A2AJ Canadian case law dataset to the sentencing decisions in this casebook" +
    (S.built ? ` (data as of ${S.built}).` : ".");

  const court = c => `
    <div class="node court">
      <div class="cname">${esc(c.name)}</div>
      <div class="row"><span>Sentencing decisions</span><b>${fmt(c.sentencing)}</b></div>
      <div class="row"><span>Systemic factor clearly mitigating</span><b>${fmt(c.systemic_mitigating)} <span style="font-weight:400">(${pct(c.systemic_mitigating, c.sentencing)})</span></b></div>
      <div class="meter g"><span style="width:${c.sentencing ? (100 * c.systemic_mitigating / c.sentencing).toFixed(1) : 0}%"></span></div>
    </div>`;

  el.innerHTML = `
    <div class="node root">
      <div class="big">${fmt(S.criminal)}</div>
      <div class="what">criminal decisions in the A2AJ dataset since <em>R. v. Gladue</em> (April 1999), from ${S.provinces.reduce((n, p) => n + p.courts.length, 0)} courts</div>
    </div>
    <div class="stem"></div>
    <div class="node total">
      <div class="big">~${fmt(S.sentencing)}</div>
      <div class="what">are sentencing decisions (${pct(S.sentencing, S.criminal)})</div>
    </div>
    <div class="stem"></div>
    <div class="legend"><span><i style="background:var(--gladue)"></i>share of sentencing decisions where the court clearly treated a systemic factor as mitigating</span></div>
    <div class="provinces" style="--n:${provs.length}">
      ${provs.map(p => {
        const mit = p.courts.reduce((n, c) => n + c.systemic_mitigating, 0);
        return `
        <div class="prov">
          <div class="node">
            <div class="name">${esc(p.name)}</div>
            <div class="what">${fmt(p.sentencing)} sentencing · ${fmt(mit)} mitigated (${pct(mit, p.sentencing)})</div>
          </div>
          <div class="courts">${p.courts.slice().sort((a, b) => COURT_ORDER.indexOf(a.code) - COURT_ORDER.indexOf(b.code)).map(court).join("")}</div>
        </div>`; }).join("")}
    </div>
    <div class="node gladue" style="margin-top:30px">
      <div class="mid">${fmt(S.systemic_mitigating)} · ${pct(S.systemic_mitigating, S.sentencing)}</div>
      <div class="what">of the ${fmt(S.sentencing)} <strong>sentencing decisions</strong> clearly treat a systemic factor as mitigating:
        Gladue factors, residential schools, colonialism, intergenerational trauma, or anti-Black or other racism</div>
    </div>
    <div class="stem"></div>
    <div class="split">
      <div class="node gladue">
        <div class="mid">${fmt(S.imposes_mitigating)} · ${pct(S.imposes_mitigating, S.imposes)}</div>
        <div class="what">of the ${fmt(S.imposes)} <strong>trial-court sentencings</strong>, where the judge passes sentence
          on the offender, clearly treat a systemic factor as mitigating</div>
      </div>
      <div class="node gladue">
        <div class="mid">${fmt(S.systemic_mitigating - S.imposes_mitigating)} · ${pct(S.systemic_mitigating - S.imposes_mitigating, S.sentencing - S.imposes)}</div>
        <div class="what">of the ${fmt(S.sentencing - S.imposes)} <strong>appeals and other sentencing decisions</strong>, mostly
          appeal courts reviewing a sentence, clearly treat a systemic factor as mitigating</div>
      </div>
    </div>
    <p class="note">Sentencing decisions were identified by a statistical model checked against 6,084 hand-labelled decisions
      (about 95% accurate). Sonnet 5.5 and Opus 5.5 read every sentencing decision. A decision is counted only when the
      court's own reasons clearly state that a systemic factor mitigated the sentence; these are exactly the cases in the
      <a href="catalogue.html">casebook</a>.</p>`;

  // Trend charts: one series each, year on the x-axis (no legend needed: the title names the series)
  const Y = (S.by_year || []);
  if (Y.length) {
    const last = Y[Y.length - 1].year, partial = S.built && Number(S.built.slice(0, 4)) === last;
    const chart = (id, title, sub, value, fmtV, kind) => {
      const W = 560, H = 250, m = { l: 40, r: 10, t: 10, b: 26 };
      const iw = W - m.l - m.r, ih = H - m.t - m.b;
      const vmax = Math.max(...Y.map(value));
      const step = kind === "pct" ? (vmax > 12 ? 5 : 2) : (vmax > 40 ? 10 : 5);
      const top = Math.ceil(vmax / step) * step;
      const x = i => m.l + (i + 0.5) * iw / Y.length, bw = Math.max(2, iw / Y.length - 2);   // 2px gap between bars
      const y = v => m.t + ih - v / top * ih;
      let g = '<g class="grid">', a = '<g class="axis">';
      for (let v = 0; v <= top; v += step) {
        g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
        a += `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${kind === "pct" ? v + "%" : v}</text>`;
      }
      Y.forEach((d, i) => { if (d.year % 5 === 0) a += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.year}</text>`; });
      g += "</g>"; a += "</g>";
      let marks = "";
      if (kind === "count") {
        Y.forEach((d, i) => {
          const h = ih * value(d) / top, op = partial && d.year === last ? 0.45 : 1;
          if (h > 0) marks += `<path d="M${x(i) - bw / 2},${y(0)} v${-Math.max(h - 4, 0)} q0,-4 4,-4 h${bw - 8} q4,0 4,4 v${Math.max(h - 4, 0)} z"
            fill="var(--gladue)" opacity="${op}"/>`;
        });
      } else {
        const pts = Y.map((d, i) => `${x(i)},${y(value(d))}`);
        const full = partial ? pts.slice(0, -1) : pts;
        marks += `<polyline points="${full.join(" ")}" fill="none" stroke="var(--gladue)" stroke-width="2" stroke-linejoin="round"/>`;
        if (partial) marks += `<polyline points="${pts.slice(-2).join(" ")}" fill="none" stroke="var(--gladue)" stroke-width="2" stroke-dasharray="3 3"/>`;
        marks += `<circle class="dot" r="4" fill="var(--gladue)" stroke="var(--panel)" stroke-width="2" style="display:none"/>`;
      }
      const hits = Y.map((d, i) => `<rect class="hit" data-i="${i}" x="${m.l + i * iw / Y.length}" y="${m.t}" width="${iw / Y.length}" height="${ih}"/>`).join("");
      return `<div class="chart" id="${id}"><h4>${title}</h4><p class="csub">${sub}</p>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}${a}${marks}${hits}</svg><div class="tip"></div></div>`;
    };
    const pctOf = d => d.sentencing ? 100 * d.mitigating / d.sentencing : 0;
    const note = partial ? ` ${last} is a partial year.` : "";
    document.getElementById("trend").innerHTML = `
      <div class="charts">
        ${chart("c-pct", "Share of sentencing decisions with a systemic factor clearly treated as mitigating", "Per cent of sentencing decisions, by year." + note, pctOf, v => v.toFixed(1) + "%", "pct")}
        ${chart("c-n", "Number of sentencing decisions with a systemic factor clearly treated as mitigating", "Decisions per year." + note, d => d.mitigating, v => v, "count")}
      </div>
      <details class="numbers"><summary>Show the numbers</summary>
        <table><tr><th>Year</th><th>Sentencing decisions</th><th>Systemic factor clearly mitigating</th><th>Share</th></tr>
        ${Y.map(d => `<tr><td>${d.year}${partial && d.year === last ? " (partial)" : ""}</td><td>${fmt(d.sentencing)}</td><td>${fmt(d.mitigating)}</td><td>${pctOf(d).toFixed(1)}%</td></tr>`).join("")}</table>
      </details>`;
    // Hover: crosshair dot on the line, tooltip on both charts
    document.querySelectorAll("#trend .chart").forEach(box => {
      const tip = box.querySelector(".tip"), svg = box.querySelector("svg"), dot = box.querySelector(".dot");
      svg.addEventListener("mousemove", e => {
        const r = e.target.closest(".hit"); if (!r) return;
        const d = Y[+r.dataset.i], vb = svg.viewBox.baseVal, sc = svg.getBoundingClientRect().width / vb.width;
        const cx = (+r.getAttribute("x") + +r.getAttribute("width") / 2);
        const isPct = box.id === "c-pct";
        const val = isPct ? pctOf(d) : d.mitigating;
        tip.innerHTML = `<b>${d.year}${partial && d.year === last ? " (partial)" : ""}</b><br>${fmt(d.mitigating)} of ${fmt(d.sentencing)} sentencing decisions (${pctOf(d).toFixed(1)}%)`;
        const svgBox = svg.getBoundingClientRect(), boxR = box.getBoundingClientRect();
        // Keep the tooltip inside its own chart box (it is centred on the point by translate(-50%))
        const half = tip.offsetWidth / 2, pad = 6;
        const left = Math.min(Math.max(svgBox.left - boxR.left + cx * sc, half + pad), boxR.width - half - pad);
        tip.style.left = left + "px";
        tip.style.top = (svgBox.top - boxR.top + 20) + "px";
        tip.style.opacity = 1;
        if (dot) {
          const W = 560, H = 250, m = { t: 10, b: 26 }, ih = H - m.t - m.b;
          const vmax = Math.max(...Y.map(pctOf)), step = vmax > 12 ? 5 : 2, top = Math.ceil(vmax / step) * step;
          dot.setAttribute("cx", cx); dot.setAttribute("cy", m.t + ih - val / top * ih); dot.style.display = "";
        }
      });
      svg.addEventListener("mouseleave", () => { tip.style.opacity = 0; if (dot) dot.style.display = "none"; });
    });
  }

  // Model results tables (from models.js, written when the site is built)
  const M = window.MODELS;
  if (M && document.getElementById("t-length")) {        // skipped while the model section is commented out
    const p3 = v => v < 0.001 ? "&lt;0.001" : v.toFixed(3);
    const sg = v => (Number(v) > 0 ? "+" : "") + v;
    const lengthTable = rows => `
      <tr><th>Model</th><th>N</th><th>G (courts)</th><th>Mitigated</th><th>β̂</th><th>SE (CRV3)</th><th>Effect on prison term</th><th>95% range</th><th>p</th><th>R²</th><th>Adj. R²</th></tr>` +
      rows.map(r => `<tr><td>${esc(r.label)}</td><td>${fmt(r.n)}</td><td>${r.courts}</td><td>${fmt(r.treated)}</td><td>${r.beta.toFixed(3)}</td>
        <td>${r.se.toFixed(3)}</td><td class="key">${sg(r.pct.toFixed(1))}%</td><td>${sg(r.pct_lo.toFixed(1))}% to ${sg(r.pct_hi.toFixed(1))}%</td>
        <td>${p3(r.p)}</td><td>${r.r2.toFixed(3)}</td><td>${r.adj_r2.toFixed(3)}</td></tr>`).join("");
    document.getElementById("t-length").innerHTML = lengthTable(M.length);
    // The introduction's numbers come from the same results, so they always match the table.
    const all = M.length[0], ind = M.length[1];
    const sig = r => r.p < 0.01 ? "significant at the 1% level, α = 0.01" : r.p < 0.05 ? "significant at the 5% level, α = 0.05"
                   : r.p < 0.10 ? "significant at the 10% level, α = 0.10" : "not statistically significant";
    const size = r => `${Math.abs(Math.round(r.pct))}% ${r.pct < 0 ? "shorter" : "longer"}`;
    document.getElementById("m-summary").textContent =
      `After controlling for them, and based on the available data, treating systemic factors as mitigating is associated ` +
      `with prison terms about ${size(all)} (${sig(all)}). Among Indigenous offenders the effect is ` +
      `${Math.abs(ind.pct) > Math.abs(all.pct) ? "starker" : "different"}: about ${size(ind)} (${sig(ind)}).`;
  }
  // Typeset the equations once KaTeX has loaded
  const typeset = () => document.querySelectorAll("[data-tex]").forEach(e =>
    katex.render(e.dataset.tex, e, { displayMode: e.classList.contains("eq"), throwOnError: false }));
  if (window.katex) typeset(); else window.addEventListener("load", () => window.katex && typeset());

  try { const l = localStorage.getItem("casebook:last"); if (l) document.getElementById("back").href = "index.html#" + l; } catch (e) {}
})();
</script>
</body>
</html>
